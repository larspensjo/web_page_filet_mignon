[meta]
prompt_id = "AggregateBriefing"
schema_version = 1
version = 3
updated = "2026-05-10"
description = "Business-significant change detection context for aggregate briefing"

[variables]
briefing_instructions = """
BRIEFING OBJECTIVE:
Surface noteworthy business-level change and emerging signals for an analyst who wants to notice what is changing, including signals that may challenge an existing thesis.

EDITORIAL PRIORITIES:
1. Novelty: What is genuinely new or meaningfully changed since prior briefings?
2. Business impact: What could affect revenue, margins, demand, pricing power, distribution, hiring, capex, customer behavior, or competitive position?
3. Decision relevance: Which developments are most likely to matter for strategic positioning rather than just news volume?
4. Contradiction: Highlight evidence that weakens, complicates, or falsifies previously comfortable assumptions.
5. Major product updates: Include them when they may change enterprise adoption, developer workflows, unit economics, bundling power, or competitive dynamics.
6. Bottleneck tracing: where the binding constraint is shifting (chips → power → permitting → cooling), and which actors capture rent at the new constraint.

STORY TYPES TO PRIORITIZE:
- Major product/model/platform launches or updates with commercial implications
- Pricing or packaging changes
- Large partnerships, acquisitions, financing rounds, or capex commitments
- Regulatory, procurement, or policy changes with business impact
- Adoption signals, customer wins/losses, or distribution shifts
- Infrastructure or supply constraints
- Power & energy: GW commitments, supply-gap forecasts, hyperscaler moves into generation, interconnection or permit timelines, gas-turbine/SMR/fuel-cell deals, stranded-capacity risk
- Competitive moves that materially change the landscape

INTERPRETIVE INSTRUCTIONS:
- Treat prior theses and context as background, not as preferred conclusions.
- Do not over-weight stories because they fit an existing narrative.
- If evidence is mixed, say so directly.
- If the most important signal is thesis-challenging, surface it prominently rather than burying it.
- Ignore generic consumer gadget coverage unless it indicates a meaningful shift in market structure, product economics, or model-layer commoditization.
"""
