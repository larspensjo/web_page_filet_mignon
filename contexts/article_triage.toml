[meta]
prompt_id = "ArticleTriage"
schema_version = 1
version = 3
updated = "2026-05-10"
description = "Business-significant triage selection context for AI-focused signal admission"

[variables]
triage_instructions = """
TRIAGE OBJECTIVE:
Select articles for business-signal review. Score for selection value: whether the article could matter commercially, strategically, operationally, financially, competitively, or regulatorily for an AI-focused portfolio analyst.

ANALYST FOCUS:
- Focus on AI and its commercial ecosystem: foundation-model labs, AI chips and compute substrate, hyperscaler capex, enterprise AI adoption, AI-driven product/platform changes, developer tooling, data-center supply chains, and policy or regulation shaping AI markets.
- Treat supporting, contradicting, and complicating evidence as equally valuable.
- Treat analyst context as background framing, not as a preferred conclusion.
- Outside this focus, require stronger commercial or strategic implications before assigning priority 3 or higher.

ADMISSION PRIORITIES:
- Admit specific developments that may affect revenue, margins, demand, pricing power, capex, supply, adoption, distribution, partnerships, policy, or competitive position.
- Treat major product, platform, model, pricing, distribution, policy, partnership, capex, adoption, and competitive changes as first-class signals.
- Do not over-weight an article because it confirms an existing assumption.
- Do not automatically down-rank major product, platform, or model releases; score them by commercial impact.
- Treat a major foundation-model release, hyperscaler platform launch, or developer-tool repricing as a priority-4 candidate when enterprise adoption, workflow change, distribution, pricing power, or competitive position is implicated.

POWER & ENERGY ADMISSION (always evaluate; this thread is bottleneck-defining):
- Treat any specific GW or MW power commitment, contract, or capacity number as priority-4 by default.
- Treat power-supply/demand gap forecasts, interconnection-queue timelines, or permit decisions as priority-4.
- Treat hyperscaler-as-utility moves (acquiring generation, restarting nuclear, equity in SMR/turbine OEMs, signing PPAs at GW scale) as priority-4 or 5.
- Treat behind-the-meter or off-grid data-center moves, gas-turbine shortages, transformer or HBM-style supply constraints as priority-3 or 4 depending on specificity.
- Treat stranded-chip or delayed-energization risk (contracted compute that cannot be powered on schedule) as priority-4.

PRIORITY SCALE:
- 5: Highly material, specific, decision-relevant development with clear commercial, strategic, regulatory, financial, operational, or competitive implications.
- 4: Strong business signal that may affect portfolio assumptions, enterprise adoption, developer behavior, pricing power, distribution, capex, supply, demand, or competitive position.
- 3: Potentially relevant signal, early evidence, notable product/platform update, competitor move, or useful context that deserves review but lacks enough specificity for priority 4 or 5.
- 2: Background, commentary, minor update, or weakly actionable context.
- 1: Generic hype, listicle, low-signal PR, consumer gadget coverage without market-structure implications, or advice content with no new data.

SIGNALS TO ADMIT:
- Named actor, customer, partner, regulator, or competitor moves.
- Dated launches, policy changes, legal rulings, pricing changes, capex plans, capacity shifts, outages, delays, or adoption milestones.
- Concrete numbers such as dollars, users, customers, chips, capacity, power, performance, pricing, margins, or timelines.
- Specific commercial mechanisms such as bundling, distribution control, developer lock-in, substitution risk, margin pressure, procurement friction, supply constraints, or regulatory exposure.
- Evidence that challenges an assumption, shows adoption friction, weakens a dominant narrative, or exposes second-order consequences.

DOWN-RANK GUIDANCE:
- Down-rank generic AI hype, thin press-release repetition, listicles, evergreen advice, speculative AGI philosophy, minor UX changes, and consumer gadget coverage without market-structure implications.
- Down-rank articles that mention important companies but provide no new business-relevant development.
- Prefer at least one of named actor, date, number, or specific commercial mechanism before scoring above 3.
- Do not require hard financial metrics for every high-value product or strategy signal when the commercial mechanism is specific and material.

TIE-BREAKER LOGIC:
- Round up when the article contains concrete business impact, novelty, contradiction, named actors, dates, numbers, or strategic optionality.
- Round down when the article mainly repeats known context, lacks a new development, or offers weakly actionable commentary.
- If implications are ambiguous, use the rationale to say what is unknown rather than forcing confidence.

TAG GUIDANCE:
- Keep tags short, stable, and useful for search. Spelling stability matters more than completeness; reuse existing tags before coining new ones.
- Prefer concrete tags such as capex, power-grid, custom-silicon, model-release, enterprise-ai, developer-tools, pricing, distribution, partnership, regulation, antitrust, export-controls, data-centers, supply-chain, adoption, competition, margins, open-source, cloud-platforms.
- Power & energy sub-tags (use under the power-grid umbrella when specific): gigawatt-commitment, gas-turbine, smr-nuclear, nuclear-restart, fuel-cell, behind-the-meter, off-grid-datacenter, ppa-deal, interconnection-queue, hyperscaler-utility, power-equipment-oem, stranded-capacity-risk, ercot, virginia-grid.
"""
