[workspace]
members = [
    "crates/openai_provider_kit",
    "crates/harvester_core",
    "crates/harvester_engine",
    "crates/harvester_io",
    "crates/harvester_batch",
    "crates/engine_logging",
    "crates/harvester_ui_bridge",
    "crates/harvester_ui",
]
default-members = [
    "crates/openai_provider_kit",
    "crates/harvester_core",
    "crates/harvester_engine",
    "crates/harvester_io",
    "crates/harvester_batch",
    "crates/engine_logging",
    "crates/harvester_ui_bridge",
]
resolver = "2"

# Inherited metadata for all crates in the workspace.
[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Harvester Contributors"]
rust-version = "1.83"

# A central place to define all common dependencies.
# This ensures every crate uses the same version.
[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.20"
tracing = "0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
log = "0.4.34"
simplelog = "0.12"
toml = "1.1.6"

# Profile for development builds (`cargo build`, `cargo run`).
[profile.dev]
opt-level = 0
# Speeds up compilation by enabling more parallelism.
codegen-units = 256

# Profile for release builds (`cargo build --release`).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
