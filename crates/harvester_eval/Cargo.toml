[package]
name = "harvester_eval"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "harvester_eval"
path = "src/main.rs"

[dependencies]
harvester_engine = { path = "../harvester_engine", features = ["eval-support"] }
engine_logging = { path = "../engine_logging" }
log.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
sha2 = "0.11.0"
hex = "0.4"
reqwest = { version = "0.13.1", default-features = false, features = ["rustls", "json", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
fastrand = "2"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
