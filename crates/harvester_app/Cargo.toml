[package]
name = "harvester_app"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
harvester_core = { path = "../harvester_core" }
harvester_engine = { path = "../harvester_engine" }
engine_logging = { path = "../engine_logging" }
commanductui = { path = "../../src/CommanDuctUI" }
log.workspace = true
simplelog.workspace = true
thiserror.workspace = true
chrono = { version = "0.4", features = ["clock"] }
ron = "0.12.0"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13.1", default-features = false, features = ["rustls", "blocking"] }
url = "2"
toml.workspace = true
pulldown-cmark = "0.13"
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
