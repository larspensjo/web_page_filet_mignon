[package]
name = "harvester_batch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "harvester_batch"
path = "src/main.rs"

[dependencies]
harvester_core = { path = "../harvester_core" }
harvester_engine = { path = "../harvester_engine" }
harvester_io = { path = "../harvester_io" }
engine_logging = { path = "../engine_logging" }
log.workspace = true
thiserror.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["clock"] }
crossterm = { version = "0.29", default-features = false, features = ["windows"] }
ctrlc = "3.4"
ron = "0.12"
async-trait = "0.1"
openai_provider_kit = { path = "../openai_provider_kit" }
tokio = { version = "1", features = ["rt-multi-thread"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
