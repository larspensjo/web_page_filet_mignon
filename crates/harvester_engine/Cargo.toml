[package]
name = "harvester_engine"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
engine_logging = { path = "../engine_logging" }
openai_provider_kit = { path = "../openai_provider_kit", features = ["test-support"] }
log.workspace = true
bytes = "1"
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.13.1", default-features = false, features = ["rustls", "stream", "gzip", "deflate", "brotli"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-util = "0.7"
html2md = "0.2"
scraper = "0.27.0"
url = "2"
encoding_rs = "0.8"
chardetng = "1.0.0"
chrono = "0.4"
feed-rs = "2.3"
thiserror.workspace = true
sha2 = "0.11.0"
tempfile = "3"
fastrand = "2"
serde_json.workspace = true
serde.workspace = true
hex = "0.4"
toml.workspace = true
psl = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
wiremock = "0.6"
pretty_assertions = "1"
ron = "0.12.0"
